name: Build and push image

on:
  push:
    branches:
      - main
    paths:
      # Trigger when bundle submodule pointer changes
      - 'bundle'
      # Also trigger when this workflow itself changes (for testing)
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with submodules
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: short_sha
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./bundle
          file: ./bundle/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.short_sha.outputs.sha_short }}

      - name: Image digest
        run: echo "Pushed image to ${{ env.REGISTRY }}/${{ github.repository }}:latest and :${{ steps.short_sha.outputs.sha_short }}"
